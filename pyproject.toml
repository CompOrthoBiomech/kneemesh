[project]
name = "kneemesh"
version = "0.1.0"
description = "B-rep geometry and meshes of knee structures from segmented images"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Scott Sibole", email = "scott.sibole@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gmsh>=4.15.2",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "scipy>=1.18.1",
    "simpleitk>=2.5.7",
    "vtk>=9.7.2",
]

[project.scripts]
kneemesh-brep = "kneemesh.pipeline:brep_main"
kneemesh-mesh = "kneemesh.pipeline:mesh_main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
docs = [
    "autodoc-pydantic>=2.2.0",
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
