[project]
name = "meniscus2brep"
version = "0.1.0"
description = "Convert meniscus images to B-rep geometry"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Scott Sibole", email = "scott.sibole@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "simpleitk>=2.5.7",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
